bundle:
  name: test-databricks-connection

variables:
  environment:
    default: dev

resources:
  jobs:
    hello_job:
      name: ${var.environment}-hello-job

      tasks:
        - task_key: hello_task

          spark_python_task:
            python_file: ./src/hello.py

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"

targets:
  dev:
    variables:
      environment: dev

  qa:
    variables:
      environment: qa

  prod:
    variables:
      environment: prod