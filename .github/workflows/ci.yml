name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository
        run: |
          echo "CI is running..."
          echo "Repository contents:"
          find . -type f

      - name: CI passed
        run: echo "✅ CI passed"
